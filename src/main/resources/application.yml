# Server path and port
server:
  servlet:
    context-path: /kotlin-microservice
  port: 8081

# Datasource
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true